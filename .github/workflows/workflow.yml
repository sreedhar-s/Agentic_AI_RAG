name: Deploy to ECR

on:
   push:
    branches:
        - main

env: 
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
  AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
  AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT_NAME: ${{ vars.AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT_NAME }}
  AZURE_OPENAI_CHAT_DEPLOYMENT_NAME: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT_NAME }}
  OPENAI_API_VERSION: ${{ vars.OPENAI_API_VERSION }}
  LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING }}
  LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT }}
  LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
  PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: $AWS_ACCESS_KEY_ID
                aws-secret-access-key: $AWS_SECRET_ACCESS_KEY
                aws-region: $AWS_REGION
            
            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v1

            - name: Build, tag, and push image to Amazon ECR
              env:
                ECR_REGISTRY: ${{steps.login-ecr.outputs.registry}}
                IMAGE_TAG: ${{github.sha}}
              run: |
                docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
                docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
                docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            - name: Output image URI
              run: |
                echo "Image pushed to ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}"