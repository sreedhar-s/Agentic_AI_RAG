name: Deploy to EKS

on:
   push:
    branches:
        - master

env: 
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
  HELM_RELEASE_NAME: ${{ vars.HELM_RELEASE_NAME }}   

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ env.AWS_REGION }}
            
            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v1

              # ── Build & push ─────────────────────────────────────────────────────────
            - name: Build, tag, and push image to ECR
              id: build-image
              env:
                ECR_REGISTRY: ${{steps.login-ecr.outputs.registry}}
                IMAGE_TAG: ${{github.sha}}
              run: |
                docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
                docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
                docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            - name: Output image URI
              run: |
                echo "Image pushed to ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}"

            # ── Helm deploy ──────────────────────────────────────────────────────────
            - name: Install Helm
              uses: azure/setup-helm@v4
              with:
                version: "v4.1.4"

            - name: Configure kubectl for EKS
              run: |
                aws eks update-kubeconfig \
                  --region $AWS_REGION \
                  --name $EKS_CLUSTER_NAME

            - name: Helm upgrade --install
              run: |
                helm upgrade --install $HELM_RELEASE_NAME ./agenticai-helm/my-app \
                  --namespace $K8S_NAMESPACE \
                  --set image.repository=${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY \
                  --set image.tag=${{ github.sha }} \
                  --set namespace=$K8S_NAMESPACE