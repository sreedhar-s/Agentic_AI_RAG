# ── Image ─────────────────────────────────────────────────────────────────────
image:
  repository: "660622823791.dkr.ecr.ap-south-1.amazonaws.com/agenticai/rag"        
  tag: "latest"         # overridden by CI with github.sha
  pullPolicy: IfNotPresent

# ── Replicas ──────────────────────────────────────────────────────────────────
replicaCount: 2

# ── Service ───────────────────────────────────────────────────────────────────
service:
  type: LoadBalancer
  port: 80              # port browsers connect to
  targetPort: 8000      # port the container listens on
  annotations: {}
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"

# ── IRSA (IAM Role for Service Accounts) ──────────────────────────────────────
serviceAccount:
  name: my-app-sa
  iamRoleArn: "arn:aws:iam::660622823791:role/secret_manager_role"        

# ── AWS Secrets Manager ────────────────────────────────────────────────────────
secrets:
  # Names of secrets stored in AWS Secrets Manager
  AZURE_OPENAI_API_KEY: "agenticai_secrets/AZURE_OPENAI_API_KEY"
  LANGSMITH_API_KEY: "agenticai_secrets/LANGSMITH_API_KEY"
  TAVILY_API_KEY: "agenticai_secrets/TAVILY_API_KEY"
  PINECONE_API_KEY: "agenticai_secrets/PINECONE_API_KEY"
  # Name of the K8s Secret the CSI driver syncs values into
  syncedSecretName: app-secrets-synced

# ── Non-sensitive config ───────────────────────────────────────────────────────
config:
  azureOpenAIEndpoint: "https://mi-oai-poc-5001.openai.azure.com/"
  azureOpenAIEmbeddingsDeploymentName: "text-embedding-ada-002"
  azureOpenAIChatDeploymentName: "gpt-4o"
  openAIApiVersion: "2025-01-01-preview"
  langsmithTracing: "true"
  langsmithEndpoint: "https://api.smith.langchain.com"
  langsmithProject: "Langgraph-Application"

# ── Container port ────────────────────────────────────────────────────────────
containerPort: 8000

# ── Health probes ─────────────────────────────────────────────────────────────
probes:
  liveness:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 5

# ── Resource limits ───────────────────────────────────────────────────────────
resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# ── Namespace ─────────────────────────────────────────────────────────────────
namespace: agentic-ai
