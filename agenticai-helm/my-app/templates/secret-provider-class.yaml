apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "my-app.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "agenticai_secrets/AZURE_OPENAI_API_KEY"
        objectType: "secretsmanager"
        objectAlias: "AZURE_OPENAI_API_KEY"
      - objectName: "agenticai_secrets/LANGSMITH_API_KEY"
        objectType: "secretsmanager"
        objectAlias: "LANGSMITH_API_KEY"
      - objectName: "agenticai_secrets/TAVILY_API_KEY"
        objectType: "secretsmanager"
        objectAlias: "TAVILY_API_KEY"
      - objectName: "agenticai_secrets/PINECONE_API_KEY"
        objectType: "secretsmanager"
        objectAlias: "PINECONE_API_KEY"

  # Syncs mounted secrets into a native K8s Secret so they can be
  # consumed as environment variables in the Deployment.
  secretObjects:
    - secretName: {{ .Values.secrets.syncedSecretName | quote }}
      type: Opaque
      data:
        - objectName: "AZURE_OPENAI_API_KEY"
          key: AZURE_OPENAI_API_KEY
        - objectName: "LANGSMITH_API_KEY"
          key: LANGSMITH_API_KEY
        - objectName: "TAVILY_API_KEY"
          key: TAVILY_API_KEY
        - objectName: "PINECONE_API_KEY"
          key: PINECONE_API_KEY
